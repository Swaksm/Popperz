<!doctype html><meta charset="utf-8"><title>heavy dom</title>
<div id="root"></div>
<script>
  // Exposed so the test can time a 5000-node insertion plus the scan it triggers.
  window.addNodes = () => {
    const fragment = document.createDocumentFragment();
    for (let i = 0; i < 5000; i++) {
      const div = document.createElement('div');
      div.textContent = `row ${i}`;
      fragment.append(div);
    }
    root.append(fragment);
  };
</script>
